<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - User Details</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#0b1220;
    color:#fff;
}

/* ===== SIDEBAR ===== */
.sidebar{
    width:260px;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    background:linear-gradient(180deg,#0f2027,#203a43);
    padding:30px 20px;
    box-shadow:5px 0 20px rgba(0,0,0,.4);
}

.sidebar h4{
    text-align:center;
    margin-bottom:40px;
    font-weight:600;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    margin-bottom:12px;
    color:#cfd8dc;
    text-decoration:none;
    border-radius:12px;
    transition:.3s;
}

.sidebar a i{ color:#00e5ff; }

.sidebar a:hover,
.sidebar a.active{
    background:rgba(255,255,255,.15);
    color:#fff;
}

/* ===== CONTENT ===== */
.content{
    margin-left:260px;
    padding:50px;
}

/* ===== TITLE ===== */
.page-title{
    font-size:28px;
    font-weight:600;
    margin-bottom:30px;
}

/* ===== GLASS CARD ===== */
.glass-box{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(14px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    margin-bottom:30px;
}

/* ===== PROFILE GRID ===== */
.profile-grid p{
    margin:10px 0;
    font-size:15px;
}

.profile-grid b{
    color:#00e5ff;
}

/* ===== HISTORY CARD ===== */
.history-card{
    background:rgba(255,255,255,.04);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.history-card img{
    width:280px;
    border-radius:12px;
    margin-top:10px;
}

/* BACK LINK */
.back-link{
    color:#00e5ff;
    text-decoration:none;
    font-size:18px;
    display:inline-block;
    margin-bottom:20px;
}
.back-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4>ADMIN PANEL</h4>

    <a href="/admin/dashboard">
        <i class="fa-solid fa-chart-line"></i> Dashboard
    </a>

    <a href="/admin/profile">
        <i class="fa-solid fa-user-shield"></i> Profile
    </a>

    <a href="/admin/users" class="active">
        <i class="fa-solid fa-users"></i> Users
    </a>

    <a href="/">
        <i class="fa-solid fa-globe"></i> Website
    </a>
</div>

<!-- CONTENT -->
<div class="content">

    <a onclick="history.back()" class="back-link">
        ← Back to Users
    </a>

    <div class="page-title">
        <i class="fa-solid fa-user"></i> User Details
    </div>

    <!-- USER PROFILE -->
    <div class="glass-box profile-grid">
        <p><b>Name:</b> {{ user.name or "No name" }}</p>
        <p><b>Email:</b> {{ user.email }}</p>
        <p><b>UID:</b> {{ user.uid }}</p>
        <p><b>Admin:</b> {{ user.admin }}</p>
        <p><b>Created:</b> {{ user.created }}</p>
        <p><b>Last Login:</b> {{ user.last_login }}</p>
    </div>

    <!-- HISTORY -->
    <div class="page-title">
        <i class="fa-solid fa-clock-rotate-left"></i> Detection History
    </div>

    <div id="historyList"></div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDKW_hw5R3u-dOZDlLFe01pkG0nd85M7x4",
    authDomain: "circuit-sherlock.firebaseapp.com",
    projectId: "circuit-sherlock",
};
firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const UID = "{{ user.uid }}";
const historyList = document.getElementById("historyList");

db.collection("users")
  .doc(UID)
  .collection("history")
  .orderBy("timestamp","desc")
  .get()
  .then(snapshot=>{
      if(snapshot.empty){
          historyList.innerHTML = `<p class="text-muted">No history found.</p>`;
          return;
      }

      snapshot.forEach(doc=>{
          let d = doc.data();
          const date = new Date(d.timestamp.seconds*1000);

          historyList.innerHTML += `
            <div class="history-card">
                <p><b>Defects:</b> ${d.defects}</p>
                <p><b>Total Cost:</b> ₹${d.total_cost}</p>
                <img src="/static/results/${d.result_image}">
                <p class="text-info mt-2">${date}</p>
            </div>
          `;
      });
  });
</script>

</body>
</html>
