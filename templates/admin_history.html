<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin – All Users History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #ffffff;
            color: #000000;
            font-family: "Poppins", sans-serif;
        }

        .user-block {
            background: #f7f7f7;
            border: 1px solid #dcdcdc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .history-card {
            background: #ffffff;
            border: 1px solid #dcdcdc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 12px;
        }

        img {
            border-radius: 6px;
        }

        .back-btn {
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container py-4">

    <a href="/admin/profile" class="btn btn-light back-btn">← Back</a>

    <h2 class="text-center mb-4">🕘 All Users' Detection History</h2>

    <div id="historyContainer">
        <p class="text-center text-muted">Loading history...</p>
    </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDKW_hw5R3u-dOZDlLFe01pkG0nd85M7x4",
        authDomain: "circuit-sherlock.firebaseapp.com",
        projectId: "circuit-sherlock"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const container = document.getElementById("historyContainer");
    container.innerHTML = "";

    // Load all users
    db.collection("users").get().then(usersSnap => {

        if (usersSnap.empty) {
            container.innerHTML = "<p class='text-center'>No users found.</p>";
            return;
        }

        usersSnap.forEach(userDoc => {

            const uid = userDoc.id;

            let userBlock = document.createElement("div");
            userBlock.className = "user-block";
            userBlock.innerHTML = `
                <h4>User: ${uid}</h4>
                <p class="text-muted">Loading history...</p>
            `;

            container.appendChild(userBlock);

            // Load user's history
            db.collection("users")
              .doc(uid)
              .collection("history")
              .orderBy("timestamp", "desc")
              .get()
              .then(historySnap => {

                if (historySnap.empty) {
                    userBlock.innerHTML += "<p class='text-muted'>No history found.</p>";
                    return;
                }

                userBlock.innerHTML = `<h4>User: ${uid}</h4>`;

                historySnap.forEach(item => {
                    const data = item.data();

                    const defects = Array.isArray(data.defects)
                        ? data.defects.join(", ")
                        : data.defects;

                    const totalCost = data.total_cost ?? 0;
                    const resultImage = data.result_image;
                    const timestamp = data.timestamp
                        ? new Date(data.timestamp.seconds * 1000).toLocaleString()
                        : "";

                    userBlock.innerHTML += `
                        <div class="history-card">
                            <p><b>Defects:</b> ${defects}</p>
                            <p><b>Total Cost:</b> ₹${totalCost}</p>
                            
                            <img src="/static/results/${resultImage}" width="250" class="mb-2">

                            <p class="text-muted">${timestamp}</p>
                        </div>
                    `;
                });

            });

        });

    });
</script>

</body>
</html>
