<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#0b1220;
    color:#fff;
}

/* ===== SIDEBAR ===== */
.sidebar{
    width:260px;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    background:linear-gradient(180deg,#0f2027,#203a43);
    padding:30px 20px;
    box-shadow:5px 0 20px rgba(0,0,0,.4);
}

.sidebar h4{
    text-align:center;
    margin-bottom:40px;
    font-weight:600;
    letter-spacing:1px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    margin-bottom:12px;
    color:#cfd8dc;
    text-decoration:none;
    border-radius:12px;
    transition:.3s;
    font-size:.95rem;
}

.menu a i{
    font-size:1.1rem;
    color:#00e5ff;
}

.menu a:hover,
.menu a.active{
    background:rgba(255,255,255,.15);
    color:#fff;
}

/* ===== MAIN ===== */
.main-content{
    margin-left:260px;
    padding:50px;
    min-height:100vh;
}

/* ===== PAGE TITLE ===== */
.page-title{
    font-size:28px;
    font-weight:600;
    margin-bottom:35px;
}

/* ===== STAT CARDS ===== */
.stat-card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(14px);
    border-radius:20px;
    padding:35px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    text-align:center;
    transition:.3s;
}

.stat-card:hover{
    transform:translateY(-6px);
}

.stat-icon{
    font-size:42px;
    color:#00e5ff;
    margin-bottom:15px;
}

.stat-title{
    font-size:15px;
    color:#b0bec5;
}

.stat-number{
    font-size:3rem;
    font-weight:600;
    margin-top:5px;
}

/* ===== BUTTON ===== */
.action-btn{
    margin-top:40px;
    background:linear-gradient(135deg,#00e5ff,#1de9b6);
    border:none;
    color:#000;
    font-weight:600;
    padding:12px 34px;
    border-radius:30px;
    transition:.3s;
}

.action-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,229,255,.4);
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4>ADMIN PANEL</h4>

    <div class="menu">
        <a href="/admin/dashboard" class="active">
            <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
        <a href="/admin/profile">
            <i class="fa-solid fa-user-shield"></i> Profile
        </a>
        <a href="/admin/users">
            <i class="fa-solid fa-users"></i> Users
        </a>
        <a href="/">
            <i class="fa-solid fa-globe"></i> Website
        </a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div class="page-title">
        <i class="fa-solid fa-gauge me-2"></i>Admin Dashboard
    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="stat-card">
                <i class="fa-solid fa-users stat-icon"></i>
                <div class="stat-title">Total Users</div>
                <div class="stat-number">{{ total_users }}</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card">
                <i class="fa-solid fa-database stat-icon"></i>
                <div class="stat-title">History Records</div>
                <div class="stat-number" id="totalHistory">0</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card">
                <i class="fa-solid fa-user-shield stat-icon"></i>
                <div class="stat-title">Admin Status</div>
                <div class="stat-number text-success">ACTIVE</div>
            </div>
        </div>

    </div>

    <div class="text-center">
        <a href="/admin/users" class="btn action-btn">
            <i class="fa-solid fa-users me-2"></i>Manage Users
        </a>
    </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDKW_hw5R3u-dOZDlLFe01pkG0nd85M7x4",
  authDomain: "circuit-sherlock.firebaseapp.com",
  projectId: "circuit-sherlock",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

db.collectionGroup("history").get().then(snap=>{
  document.getElementById("totalHistory").innerText = snap.size;
});
</script>

</body>
</html>
