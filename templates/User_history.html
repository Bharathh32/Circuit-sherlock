<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your History</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#0b1220;
    color:#fff;
}

/* ===== SIDEBAR ===== */
.sidebar{
    width:260px;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    background:linear-gradient(180deg,#0f2027,#203a43);
    padding:30px 20px;
    box-shadow:5px 0 20px rgba(0,0,0,.4);
}

.sidebar h4{
    text-align:center;
    margin-bottom:40px;
    font-weight:600;
    letter-spacing:1px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    margin-bottom:12px;
    color:#cfd8dc;
    text-decoration:none;
    border-radius:12px;
    transition:.3s;
    font-size:.95rem;
}

.menu a i{
    font-size:1.1rem;
    color:#00e5ff;
}

.menu a:hover,
.menu a.active{
    background:rgba(255,255,255,.15);
    color:#fff;
}

/* ===== MAIN CONTENT ===== */
.main-content{
    margin-left:260px;
    padding:50px;
    min-height:100vh;
}

/* ===== TITLE ===== */
.page-title{
    font-size:28px;
    font-weight:600;
    margin-bottom:35px;
}

/* ===== HISTORY CARD ===== */
.history-card{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(14px);
    border-radius:20px;
    padding:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    margin-bottom:25px;
    display:grid;
    grid-template-columns:220px 1fr;
    gap:20px;
    transition:.3s;
}

.history-card:hover{
    transform:translateY(-4px);
    box-shadow:0 20px 50px rgba(0,229,255,.25);
}

.history-img{
    width:100%;
    border-radius:14px;
    border:2px solid rgba(255,255,255,.2);
}

.history-details p{
    margin:6px 0;
    font-size:.95rem;
}

.history-details b{
    color:#00e5ff;
}

.history-date{
    margin-top:10px;
    font-size:.85rem;
    color:#b0bec5;
}

.empty-msg{
    text-align:center;
    color:#b0bec5;
    font-size:1.1rem;
    margin-top:60px;
}
</style>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDKW_hw5R3u-dOZDlLFe01pkG0nd85M7x4",
    authDomain: "circuit-sherlock.firebaseapp.com",
    projectId: "circuit-sherlock",
    storageBucket: "circuit-sherlock.firebasestorage.app",
    messagingSenderId: "557316331202",
    appId: "1:557316331202:web:9541d05d9d1d97b1c90d5b",
    measurementId: "G-F5Y1EGXGED"
};
firebase.initializeApp(firebaseConfig);
</script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4>USER PANEL</h4>

    <div class="menu">
        <a href="/profile">
            <i class="fa-solid fa-user"></i> User Profile
        </a>

        <a href="/history" class="active">
            <i class="fa-solid fa-clock-rotate-left"></i> History
        </a>

        <a href="/">
            <i class="fa-solid fa-globe"></i> Website
        </a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div class="page-title">
        <i class="fa-solid fa-clock-rotate-left me-2"></i> Detection History
    </div>

    <div id="history"></div>

</div>

<script>
firebase.auth().onAuthStateChanged((user)=>{
    if(!user){
        document.getElementById("history").innerHTML =
            `<div class="empty-msg">Please login to view history.</div>`;
        return;
    }

    firebase.firestore()
        .collection("users")
        .doc(user.uid)
        .collection("history")
        .orderBy("timestamp","desc")
        .get()
        .then((snap)=>{
            if(snap.empty){
                document.getElementById("history").innerHTML =
                    `<div class="empty-msg">No history found.</div>`;
                return;
            }

            let html = "";
            snap.forEach(doc=>{
                const d = doc.data();
                html += `
                    <div class="history-card">
                        <img src="/static/results/${d.result_image}" class="history-img">
                        <div class="history-details">
                            <p><b>Defects:</b> ${d.defects}</p>
                            <p><b>Total Cost:</b> ₹${d.total_cost}</p>
                            <div class="history-date">
                                <i class="fa-regular fa-calendar"></i>
                                ${d.timestamp.toDate()}
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById("history").innerHTML = html;
        });
});
</script>

</body>
</html>
