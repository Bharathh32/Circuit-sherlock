<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Profile</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#0b1220;
    color:#fff;
}

/* ===== SIDEBAR ===== */
.sidebar{
    width:260px;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    background:linear-gradient(180deg,#0f2027,#203a43);
    padding:30px 20px;
    box-shadow:5px 0 20px rgba(0,0,0,.4);
}

.sidebar h4{
    text-align:center;
    margin-bottom:40px;
    font-weight:600;
    letter-spacing:1px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    margin-bottom:12px;
    color:#cfd8dc;
    text-decoration:none;
    border-radius:12px;
    transition:.3s;
}

.sidebar a i{
    font-size:1.1rem;
    color:#00e5ff;
}

.sidebar a:hover,
.sidebar a.active{
    background:rgba(255,255,255,.15);
    color:#fff;
}

/* ===== MAIN ===== */
.main-content{
    margin-left:260px;
    padding:50px;
    min-height:100vh;
}

/* ===== PROFILE CARD ===== */
.profile-card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(14px);
    border-radius:20px;
    padding:35px;
    max-width:650px;
    margin:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    animation:fadeUp .7s ease;
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}

/* ===== AVATAR ===== */
.avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.4);
    object-fit:cover;
    margin:auto;
    display:block;
}

/* ===== TEXT ===== */
.email{
    text-align:center;
    font-weight:600;
    margin-top:18px;
    font-size:1.3rem;
}

.uid{
    text-align:center;
    color:#b0bec5;
    font-size:.9rem;
    margin-bottom:30px;
}

/* ===== INFO ROW ===== */
.info-row{
    display:flex;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.15);
    font-size:.95rem;
}

.info-row i{
    color:#00e5ff;
    margin-right:8px;
}

/* ===== BADGE ===== */
.badge-admin{
    padding:6px 14px;
    border-radius:20px;
    font-size:.8rem;
}

.admin-yes{
    background:rgba(0,200,83,.25);
    color:#00e676;
}

/* ===== ACTION BUTTON ===== */
.action-btn{
    margin-top:30px;
    background:linear-gradient(135deg,#00e5ff,#1de9b6);
    border:none;
    color:#000;
    font-weight:600;
    padding:12px 28px;
    border-radius:30px;
    transition:.3s;
}

.action-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,229,255,.4);
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4>ADMIN PANEL</h4>

    <a href="/admin/dashboard">
        <i class="fa-solid fa-chart-line"></i> Dashboard
    </a>

    <a href="/admin/profile" class="active">
        <i class="fa-solid fa-user-shield"></i> Profile
    </a>

    <a href="/admin/users">
        <i class="fa-solid fa-users"></i> Users
    </a>

    <a href="/">
        <i class="fa-solid fa-globe"></i> Website
    </a>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div class="profile-card">

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="avatar">

        <div class="email">{{ user.email }}</div>
        <div class="uid">UID: {{ user.uid }}</div>

        <div>

            <div class="info-row">
                <span><i class="fa-solid fa-calendar-plus"></i>Account Created</span>
                <span>{{ user.created | readable_date }}</span>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-clock-rotate-left"></i>Last Login</span>
                <span>{{ user.last_login | readable_date }}</span>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-key"></i>Token Issued</span>
                <span>{{ user.iat | readable_date }}</span>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-hourglass-end"></i>Token Expires</span>
                <span>{{ user.exp | readable_date }}</span>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-user-shield"></i>Admin</span>
                <span class="badge-admin admin-yes">YES</span>
            </div>

        </div>

        <div class="text-center">
            <a href="/admin/users" class="btn action-btn">
                <i class="fa-solid fa-users me-2"></i>Manage Users
            </a>
        </div>

    </div>

</div>

</body>
</html>
